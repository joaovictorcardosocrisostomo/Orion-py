[project]
name = "orion-py"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "openai>=3.8.0",
    "pandas==3.0.5",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
    "pytz>=2026.3.post1",
    "redis>=8.1.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
