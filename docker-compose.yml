version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: orion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orion_user
      POSTGRES_PASSWORD: orion_password
      POSTGRES_DB: orion_db
    ports:
      - "5432:5432"
    volumes:
      - orion_db_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: orion_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - orion_redis_data:/data

volumes:
  orion_db_data:
  orion_redis_data:
